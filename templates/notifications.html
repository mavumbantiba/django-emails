<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
     <style>
        .warning{
            color: blue;
        }
        .success{
            color: green;
        }
        .error{
            color:red
        }
    </style>
</head>
<body>
    {% if messages %}
    <dialog open id="message">
        {% for message in messages %}
        <p class="{{message.tags}}">{{message}}</p>
        {% endfor %}
        <button type="button" onclick="document.getElementById('message').close();">Close</button>
    </dialog>
    {% endif %}
    <h2>Send notifications to users</h2>
    <hr>
    <form method="post">
        {% csrf_token %}
        <input type="text" name='subject' required placeholder="Enter subject"> <br>
        <textarea name="message" id="msg" placeholder="Your message" required></textarea>
        <button>Send</button>
    </form>
</body>
</html>
